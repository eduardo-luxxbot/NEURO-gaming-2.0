<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siquera JR - Rhythm Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a0f 70%);
            position: relative;
        }
        
        /* Background particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00d4ff;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
            pointer-events: none;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }
        
        /* Main game area */
        #playfield {
            width: 800px;
            height: 600px;
            position: relative;
            background: radial-gradient(ellipse at center, rgba(20, 10, 40, 0.8) 0%, transparent 70%);
            border-radius: 20px;
            box-shadow: 0 0 100px rgba(138, 43, 226, 0.3);
        }
        
        /* PUMP-style receptor buttons (5 panels) */
        .receptor {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 900;
            transition: all 0.05s;
            cursor: pointer;
            z-index: 10;
        }
        
        .receptor::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.1s;
        }
        
        .receptor.active {
            transform: scale(0.9);
            filter: brightness(1.5);
        }
        
        .receptor.active::before {
            opacity: 1;
            animation: pulse 0.3s ease-out;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        
        /* PUMP layout: UL, UR, C, DL, DR */
        #receptor-UL { 
            top: 50px; 
            left: 200px; 
            background: linear-gradient(135deg, #ff006e, #ff4d9e);
            box-shadow: 0 0 30px #ff006e, inset 0 0 20px rgba(255,255,255,0.2);
            transform: rotate(-45deg);
        }
        #receptor-UL::before { border: 3px solid #ff006e; }
        #receptor-UL span { transform: rotate(45deg); }
        
        #receptor-UR { 
            top: 50px; 
            right: 200px; 
            background: linear-gradient(135deg, #00d4ff, #4de8ff);
            box-shadow: 0 0 30px #00d4ff, inset 0 0 20px rgba(255,255,255,0.2);
            transform: rotate(45deg);
        }
        #receptor-UR::before { border: 3px solid #00d4ff; }
        #receptor-UR span { transform: rotate(-45deg); }
        
        #receptor-C { 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            box-shadow: 0 0 40px #ffd700, inset 0 0 20px rgba(255,255,255,0.3);
            width: 90px;
            height: 90px;
            border-radius: 50%;
        }
        #receptor-C::before { border: 3px solid #ffd700; border-radius: 50%; }
        
        #receptor-DL { 
            bottom: 50px; 
            left: 200px; 
            background: linear-gradient(135deg, #8b5cf6, #b794f6);
            box-shadow: 0 0 30px #8b5cf6, inset 0 0 20px rgba(255,255,255,0.2);
            transform: rotate(45deg);
        }
        #receptor-DL::before { border: 3px solid #8b5cf6; }
        #receptor-DL span { transform: rotate(-45deg); }
        
        #receptor-DR { 
            bottom: 50px; 
            right: 200px; 
            background: linear-gradient(135deg, #10b981, #34d399);
            box-shadow: 0 0 30px #10b981, inset 0 0 20px rgba(255,255,255,0.2);
            transform: rotate(-45deg);
        }
        #receptor-DR::before { border: 3px solid #10b981; }
        #receptor-DR span { transform: rotate(45deg); }
        
        /* osu! style approach circles */
        .approach-circle {
            position: absolute;
            border: 4px solid;
            border-radius: 15px;
            opacity: 0.8;
            pointer-events: none;
            animation: approach 1s linear forwards;
        }
        
        @keyframes approach {
            0% { transform: scale(2); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0; }
        }
        
        .approach-circle.center {
            border-radius: 50%;
        }
        
        /* Notes */
        .note {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            z-index: 5;
            box-shadow: 0 0 20px currentColor;
        }
        
        .note.center {
            width: 90px;
            height: 90px;
            border-radius: 50%;
        }
        
        .note-UL { 
            background: linear-gradient(135deg, #ff006e, #ff4d9e);
            color: #ff006e;
            left: 200px;
        }
        .note-UR { 
            background: linear-gradient(135deg, #00d4ff, #4de8ff);
            color: #00d4ff;
            right: 200px;
        }
        .note-C { 
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #ffd700;
            left: 50%;
            transform: translateX(-50%);
        }
        .note-DL { 
            background: linear-gradient(135deg, #8b5cf6, #b794f6);
            color: #8b5cf6;
            left: 200px;
        }
        .note-DR { 
            background: linear-gradient(135deg, #10b981, #34d399);
            color: #10b981;
            right: 200px;
        }
        
        /* Hit effects */
        .hit-effect {
            position: absolute;
            pointer-events: none;
            animation: hitBurst 0.5s ease-out forwards;
            z-index: 20;
        }
        
        @keyframes hitBurst {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .hit-perfect {
            width: 100px;
            height: 100px;
            border: 3px solid #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 30px #ffd700, inset 0 0 30px #ffd700;
        }
        
        .hit-great {
            width: 80px;
            height: 80px;
            border: 3px solid #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00d4ff;
        }
        
        .hit-good {
            width: 60px;
            height: 60px;
            border: 3px solid #10b981;
            border-radius: 50%;
        }
        
        .hit-miss {
            width: 50px;
            height: 50px;
            border: 2px solid #ef4444;
            border-radius: 50%;
            animation: missShake 0.3s ease-out;
        }
        
        @keyframes missShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        /* Judgment text */
        .judgment {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            text-shadow: 0 0 20px currentColor;
            pointer-events: none;
            animation: judgmentFloat 0.8s ease-out forwards;
            z-index: 30;
        }
        
        @keyframes judgmentFloat {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.2); opacity: 0; }
        }
        
        .judgment-perfect { color: #ffd700; text-shadow: 0 0 30px #ffd700; }
        .judgment-great { color: #00d4ff; text-shadow: 0 0 20px #00d4ff; }
        .judgment-good { color: #10b981; }
        .judgment-miss { color: #ef4444; }
        
        /* UI Elements */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }
        
        .ui-panel {
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.5);
            border-radius: 10px;
            padding: 15px 25px;
            backdrop-filter: blur(10px);
        }
        
        .score-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .combo-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #00d4ff;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }
        
        .combo-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .accuracy-bar {
            width: 200px;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .accuracy-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #ffd700, #00d4ff);
            transition: width 0.3s;
        }
        
        .health-bar {
            width: 300px;
            height: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #ffd700, #10b981);
            transition: width 0.2s;
            box-shadow: 0 0 20px currentColor;
        }
        
        /* Progress bar */
        #progressBar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: rgba(255,255,255,0.1);
        }
        
        #progressFill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #00d4ff, #ffd700);
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 20px #00d4ff;
        }
        
        /* Start screen */
        #startScreen {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 15, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff006e, #00d4ff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.5);
            margin-bottom: 20px;
            animation: titlePulse 2s ease-in-out infinite;
        }
        
        @keyframes titlePulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .subtitle {
            font-size: 24px;
            color: #888;
            margin-bottom: 40px;
            letter-spacing: 5px;
        }
        
        .controls-info {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .key-box {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            transition: all 0.3s;
        }
        
        .key-q { border-color: #ff006e; color: #ff006e; box-shadow: 0 0 20px rgba(255, 0, 110, 0.3); }
        .key-w { border-color: #00d4ff; color: #00d4ff; box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
        .key-s { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }
        .key-a { border-color: #8b5cf6; color: #8b5cf6; box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
        .key-d { border-color: #10b981; color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        
        .btn-start {
            padding: 20px 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff006e, #00d4ff);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.5);
        }
        
        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.7);
        }
        
        /* Results screen */
        #resultsScreen {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 15, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .grade-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 150px;
            font-weight: 900;
            margin-bottom: 30px;
            animation: gradePop 0.5s ease-out;
        }
        
        @keyframes gradePop {
            0% { transform: scale(0) rotate(-180deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        
        .grade-SS { color: #ffd700; text-shadow: 0 0 60px #ffd700; }
        .grade-S { color: #c0c0c0; text-shadow: 0 0 40px #c0c0c0; }
        .grade-A { color: #ff6b35; text-shadow: 0 0 40px #ff6b35; }
        .grade-B { color: #00d4ff; text-shadow: 0 0 40px #00d4ff; }
        .grade-C { color: #8b5cf6; text-shadow: 0 0 40px #8b5cf6; }
        .grade-D { color: #ef4444; text-shadow: 0 0 40px #ef4444; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: #00d4ff;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        
        /* Key hints */
        .key-hint {
            position: absolute;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
        }
        
        #hint-q { top: 30px; left: 230px; }
        #hint-w { top: 30px; right: 230px; }
        #hint-s { top: 50%; left: 50%; transform: translate(-50%, -120%); }
        #hint-a { bottom: 30px; left: 230px; }
        #hint-d { bottom: 30px; right: 230px; }
        
        /* Lane lines (osu! style) */
        .lane-line {
            position: absolute;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }
        
        .lane-UL { left: 239px; }
        .lane-UR { right: 239px; }
        .lane-C { left: 50%; transform: translateX(-50%); width: 4px; background: linear-gradient(to bottom, transparent, rgba(255,215,0,0.2), transparent); }
        .lane-DL { left: 239px; }
        .lane-DR { right: 239px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- Background particles -->
        <div id="particles"></div>
        
        <div id="playfield">
            <!-- Lane lines -->
            <div class="lane-line lane-UL"></div>
            <div class="lane-line lane-UR"></div>
            <div class="lane-line lane-C"></div>
            
            <!-- Receptors (PUMP style) -->
            <div class="receptor" id="receptor-UL" data-key="q"><span>↖</span></div>
            <div class="receptor" id="receptor-UR" data-key="w"><span>↗</span></div>
            <div class="receptor center" id="receptor-C" data-key="s"><span>●</span></div>
            <div class="receptor" id="receptor-DL" data-key="a"><span>↙</span></div>
            <div class="receptor" id="receptor-DR" data-key="d"><span>↘</span></div>
            
            <!-- Key hints -->
            <div class="key-hint" id="hint-q">Q</div>
            <div class="key-hint" id="hint-w">W</div>
            <div class="key-hint" id="hint-s">S</div>
            <div class="key-hint" id="hint-a">A</div>
            <div class="key-hint" id="hint-d">D</div>
            
            <!-- Notes container -->
            <div id="notesContainer"></div>
            
            <!-- Effects container -->
            <div id="effectsContainer"></div>
            
            <!-- Progress bar -->
            <div id="progressBar">
                <div id="progressFill"></div>
            </div>
        </div>
        
        <!-- UI -->
        <div id="ui">
            <div class="ui-panel">
                <div class="score-display" id="scoreDisplay">00000000</div>
                <div class="accuracy-bar">
                    <div class="accuracy-fill" id="accuracyFill" style="width: 100%"></div>
                </div>
            </div>
            
            <div class="ui-panel" style="text-align: center;">
                <div class="combo-display" id="comboDisplay">0</div>
                <div class="combo-label">COMBO</div>
            </div>
            
            <div class="ui-panel">
                <div class="health-bar">
                    <div class="health-fill" id="healthFill" style="width: 100%"></div>
                </div>
            </div>
        </div>
        
        <!-- Start Screen -->
        <div id="startScreen">
            <h1 class="game-title">NEURO: PULSE</h1>
            <p class="subtitle">PUMP STYLE × OSU! PRECISION</p>
            
            <div class="controls-info">
                <div class="key-box key-q">Q</div>
                <div class="key-box key-w">W</div>
                <div class="key-box key-s">S</div>
                <div class="key-box key-a">A</div>
                <div class="key-box key-d">D</div>
            </div>
            
            <button class="btn-start" onclick="startGame()">INICIAR</button>
        </div>
        
        <!-- Results Screen -->
        <div id="resultsScreen">
            <div class="grade-display" id="gradeDisplay">S</div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="finalScore">0</div>
                    <div class="stat-label">Pontuação</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="finalAccuracy">0%</div>
                    <div class="stat-label">Precisão</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="finalCombo">0</div>
                    <div class="stat-label">Max Combo</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="finalPerfect">0</div>
                    <div class="stat-label">Perfects</div>
                </div>
            </div>
            
            <button class="btn-start" onclick="restartGame()">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script>
        // Game state
        let gameState = {
            isPlaying: false,
            score: 0,
            combo: 0,
            maxCombo: 0,
            health: 100,
            accuracy: 100,
            perfects: 0,
            greats: 0,
            goods: 0,
            misses: 0,
            totalNotes: 0,
            startTime: 0,
            bpm: 128
        };
        
        // Note positions (matching PUMP layout)
        const notePositions = {
            'UL': { x: 200, y: 50, key: 'q', label: '↖' },
            'UR': { x: 520, y: 50, key: 'w', label: '↗' },
            'C': { x: 355, y: 260, key: 's', label: '●', isCenter: true },
            'DL': { x: 200, y: 470, key: 'a', label: '↙' },
            'DR': { x: 520, y: 470, key: 'd', label: '↘' }
        };
        
        // Timing windows (osu! style - in milliseconds)
        const timingWindows = {
            perfect: 45,  // Marvellous
            great: 90,    // Perfect  
            good: 135,    // Great
            miss: 180     // Miss
        };
        
        let notes = [];
        let noteIdCounter = 0;
        let gameLoopId;
        let spawnIntervalId;
        let audioContext;
        
        // Initialize particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        
        // Audio synthesis (Web Audio API)
        function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        function playHitSound(type) {
            if (!audioContext) return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            const now = audioContext.currentTime;
            
            switch(type) {
                case 'perfect':
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    break;
                case 'great':
                    osc.frequency.setValueAtTime(660, now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    break;
                case 'good':
                    osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    break;
                case 'miss':
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    break;
            }
            
            osc.start(now);
            osc.stop(now + 0.3);
        }
        
        // Spawn note with osu! approach circle
        function spawnNote(lane) {
            const container = document.getElementById('notesContainer');
            const pos = notePositions[lane];
            const id = noteIdCounter++;
            
            // Create approach circle (osu! style)
            const approach = document.createElement('div');
            approach.className = `approach-circle ${pos.isCenter ? 'center' : ''}`;
            approach.style.cssText = `
                width: ${pos.isCenter ? 90 : 80}px;
                height: ${pos.isCenter ? 90 : 80}px;
                left: ${pos.x}px;
                top: ${pos.y}px;
                border-color: ${getLaneColor(lane)};
                transform: translate(-50%, -50%);
            `;
            container.appendChild(approach);
            
            // Create note
            const noteEl = document.createElement('div');
            noteEl.className = `note note-${lane} ${pos.isCenter ? 'center' : ''}`;
            noteEl.id = `note-${id}`;
            noteEl.style.cssText = `
                left: ${pos.x}px;
                top: ${pos.y}px;
                transform: translate(-50%, -50%);
            `;
            noteEl.innerHTML = `<span style="${pos.isCenter ? '' : `display: inline-block; transform: rotate(${lane === 'UL' || lane === 'DR' ? '45' : '-45'}deg)`}">${pos.label}</span>`;
            
            container.appendChild(noteEl);
            
            const note = {
                id: id,
                lane: lane,
                spawnTime: Date.now(),
                hitTime: Date.now() + 1000, // 1 second approach time
                element: noteEl,
                approach: approach,
                hit: false
            };
            
            notes.push(note);
            gameState.totalNotes++;
        }
        
        function getLaneColor(lane) {
            const colors = {
                'UL': '#ff006e',
                'UR': '#00d4ff',
                'C': '#ffd700',
                'DL': '#8b5cf6',
                'DR': '#10b981'
            };
            return colors[lane];
        }
        
        // Game loop
        function gameLoop() {
            if (!gameState.isPlaying) return;
            
            const now = Date.now();
            
            // Check for missed notes
            notes.forEach((note, index) => {
                if (note.hit) return;
                
                const timeDiff = now - note.hitTime;
                
                if (timeDiff > timingWindows.miss) {
                    // Miss
                    showJudgment('miss', note.lane);
                    createHitEffect('miss', note.lane);
                    playHitSound('miss');
                    handleMiss();
                    removeNote(index);
                }
            });
            
            // Update progress
            const progress = Math.min(100, ((now - gameState.startTime) / 60000) * 100);
            document.getElementById('progressFill').style.width = progress + '%';
            
            // Check game over
            if (gameState.health <= 0) {
                endGame();
            }
            
            gameLoopId = requestAnimationFrame(gameLoop);
        }
        
        // Handle input
        function handleInput(lane) {
            if (!gameState.isPlaying) return;
            
            const now = Date.now();
            const receptor = document.getElementById(`receptor-${lane}`);
            
            // Visual feedback
            receptor.classList.add('active');
            setTimeout(() => receptor.classList.remove('active'), 100);
            
            // Find closest note in this lane
            const laneNotes = notes.filter(n => n.lane === lane && !n.hit);
            if (laneNotes.length === 0) return;
            
            const closestNote = laneNotes.reduce((closest, note) => {
                const closestDiff = Math.abs(now - closest.hitTime);
                const noteDiff = Math.abs(now - note.hitTime);
                return noteDiff < closestDiff ? note : closest;
            });
            
            const timeDiff = Math.abs(now - closestNote.hitTime);
            
            // Judge timing
            let judgment = 'miss';
            if (timeDiff <= timingWindows.perfect) judgment = 'perfect';
            else if (timeDiff <= timingWindows.great) judgment = 'great';
            else if (timeDiff <= timingWindows.good) judgment = 'good';
            
            if (judgment !== 'miss') {
                closestNote.hit = true;
                showJudgment(judgment, lane);
                createHitEffect(judgment, lane);
                playHitSound(judgment);
                handleHit(judgment);
                removeNote(notes.indexOf(closestNote));
            }
        }
        
        function handleHit(judgment) {
            const multipliers = { perfect: 1, great: 0.8, good: 0.5 };
            const baseScore = 300;
            
            gameState.combo++;
            if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;
            
            const comboMultiplier = 1 + (Math.floor(gameState.combo / 10) * 0.1);
            const points = Math.floor(baseScore * multipliers[judgment] * comboMultiplier);
            
            gameState.score += points;
            
            // Update counters
            if (judgment === 'perfect') gameState.perfects++;
            else if (judgment === 'great') gameState.greats++;
            else if (judgment === 'good') gameState.goods++;
            
            // Health
            gameState.health = Math.min(100, gameState.health + (judgment === 'perfect' ? 2 : 1));
            
            updateUI();
        }
        
        function handleMiss() {
            gameState.combo = 0;
            gameState.misses++;
            gameState.health = Math.max(0, gameState.health - 10);
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('scoreDisplay').textContent = gameState.score.toString().padStart(8, '0');
            document.getElementById('comboDisplay').textContent = gameState.combo;
            document.getElementById('healthFill').style.width = gameState.health + '%';
            
            // Calculate accuracy
            const hitNotes = gameState.perfects + gameState.greats + gameState.goods;
            const totalJudged = hitNotes + gameState.misses;
            const accuracy = totalJudged > 0 ? (hitNotes / totalJudged) * 100 : 100;
            gameState.accuracy = accuracy;
            document.getElementById('accuracyFill').style.width = accuracy + '%';
        }
        
        function showJudgment(type, lane) {
            const container = document.getElementById('effectsContainer');
            const pos = notePositions[lane];
            
            const judgment = document.createElement('div');
            judgment.className = `judgment judgment-${type}`;
            judgment.textContent = type.toUpperCase();
            judgment.style.cssText = `
                left: ${pos.x}px;
                top: ${pos.y - 50}px;
                transform: translateX(-50%);
            `;
            
            container.appendChild(judgment);
            setTimeout(() => judgment.remove(), 800);
        }
        
        function createHitEffect(type, lane) {
            const container = document.getElementById('effectsContainer');
            const pos = notePositions[lane];
            
            const effect = document.createElement('div');
            effect.className = `hit-effect hit-${type}`;
            effect.style.cssText = `
                left: ${pos.x}px;
                top: ${pos.y}px;
                transform: translate(-50%, -50%);
            `;
            
            container.appendChild(effect);
            setTimeout(() => effect.remove(), 500);
        }
        
        function removeNote(index) {
            if (index >= 0 && index < notes.length) {
                const note = notes[index];
                if (note.element) note.element.remove();
                if (note.approach) note.approach.remove();
                notes.splice(index, 1);
            }
        }
        
        // Note spawning patterns
        function startSpawning() {
            const lanes = ['UL', 'UR', 'C', 'DL', 'DR'];
            let patternIndex = 0;
            
            // Predefined patterns (PUMP style)
            const patterns = [
                ['C'], ['UL', 'DR'], ['UR', 'DL'], ['C'],
                ['UL', 'UR'], ['DL', 'DR'], ['C'],
                ['UL', 'C', 'DR'], ['UR', 'C', 'DL'],
                ['UL', 'UR', 'DL', 'DR'], ['C'],
                ['UL', 'UR', 'C', 'DL', 'DR']
            ];
            
            spawnIntervalId = setInterval(() => {
                if (!gameState.isPlaying) return;
                
                const pattern = patterns[patternIndex % patterns.length];
                pattern.forEach((lane, i) => {
                    setTimeout(() => spawnNote(lane), i * 100);
                });
                
                patternIndex++;
            }, 500); // Spawn every 500ms (128 BPM feel)
        }
        
        function startGame() {
            initAudio();
            document.getElementById('startScreen').style.display = 'none';
            
            // Reset state
            gameState = {
                isPlaying: true,
                score: 0,
                combo: 0,
                maxCombo: 0,
                health: 100,
                accuracy: 100,
                perfects: 0,
                greats: 0,
                goods: 0,
                misses: 0,
                totalNotes: 0,
                startTime: Date.now(),
                bpm: 128
            };
            
            notes = [];
            noteIdCounter = 0;
            
            // Clear containers
            document.getElementById('notesContainer').innerHTML = '';
            document.getElementById('effectsContainer').innerHTML = '';
            
            updateUI();
            gameLoop();
            startSpawning();
            
            // Auto-end after 60 seconds
            setTimeout(endGame, 60000);
        }
        
        function endGame() {
            gameState.isPlaying = false;
            clearInterval(spawnIntervalId);
            cancelAnimationFrame(gameLoopId);
            
            // Calculate grade
            const hitNotes = gameState.perfects + gameState.greats + gameState.goods;
            const total = hitNotes + gameState.misses;
            const accuracy = total > 0 ? (hitNotes / total) * 100 : 0;
            
            let grade = 'D';
            if (accuracy >= 95 && gameState.misses === 0) grade = 'SS';
            else if (accuracy >= 90) grade = 'S';
            else if (accuracy >= 80) grade = 'A';
            else if (accuracy >= 70) grade = 'B';
            else if (accuracy >= 60) grade = 'C';
            
            // Show results
            document.getElementById('gradeDisplay').textContent = grade;
            document.getElementById('gradeDisplay').className = `grade-display grade-${grade}`;
            document.getElementById('finalScore').textContent = gameState.score.toLocaleString();
            document.getElementById('finalAccuracy').textContent = accuracy.toFixed(1) + '%';
            document.getElementById('finalCombo').textContent = gameState.maxCombo;
            document.getElementById('finalPerfect').textContent = gameState.perfects;
            
            document.getElementById('resultsScreen').style.display = 'flex';
        }
        
        function restartGame() {
            document.getElementById('resultsScreen').style.display = 'none';
            startGame();
        }
        
        // Keyboard input
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            
            const keyMap = {
                'q': 'UL', 'Q': 'UL',
                'w': 'UR', 'W': 'UR',
                's': 'C', 'S': 'C',
                'a': 'DL', 'A': 'DL',
                'd': 'DR', 'D': 'DR',
                '7': 'UL', '9': 'UR', '5': 'C', '1': 'DL', '3': 'DR' // Numpad style
            };
            
            if (keyMap[e.key]) {
                e.preventDefault();
                handleInput(keyMap[e.key]);
            }
        });
        
        // Mouse/touch input
        Object.keys(notePositions).forEach(lane => {
            const receptor = document.getElementById(`receptor-${lane}`);
            receptor.addEventListener('mousedown', () => handleInput(lane));
            receptor.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleInput(lane);
            });
        });
        
        // Initialize
        createParticles();
    </script>
</body>
</html>
