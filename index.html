<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turistou · Presidente Prudente</title>

    <!-- Leaflet CSS (mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & VARIABLES ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a73e8;
            --primary-dark: #0d47a1;
            --primary-light: #e8f0fe;
            --secondary: #34a853;
            --accent: #fbbc04;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Poppins', sans-serif;
            --header-h: 70px;
            --max-w: 1200px;
        }

        .dark {
            --primary: #4da3ff;
            --primary-dark: #82b1ff;
            --primary-light: #1a2a4a;
            --secondary: #81c784;
            --accent: #fdd835;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            line-height: 1.7;
            padding-top: var(--header-h);
            overflow-x: hidden;
        }

        .container {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0 24px;
        }

        section { padding: 80px 0; }

        .section-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 14px;
            border-radius: 50px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text);
            line-height: 1.25;
        }

        .section-sub {
            color: var(--text-light);
            margin-bottom: 40px;
            font-size: 1.05rem;
            max-width: 600px;
        }

        .section-title.center,
        .section-sub.center { text-align: center; margin-left: auto; margin-right: auto; }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 12px rgba(0,0,0,0.04);
            z-index: 1000;
            transition: background var(--transition), border-color var(--transition);
        }

        header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }
        .logo i { font-size: 1.7rem; }
        .logo span { color: var(--text); }
        .logo span.highlight { color: var(--primary); }

        nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        nav a {
            padding: 8px 14px;
            border-radius: var(--radius-xs);
            font-weight: 500;
            font-size: 0.85rem;
            transition: background var(--transition), color var(--transition);
            color: var(--text-light);
            white-space: nowrap;
        }

        nav a:hover,
        nav a.active {
            background: var(--primary);
            color: #fff;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
            background: none;
            border: none;
            padding: 4px;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: calc(100vh - var(--header-h));
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            background: linear-gradient(135deg, #0d47a1 0%, #1a73e8 60%, #4da3ff 100%);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(255,255,255,0.08) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        .hero-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            overflow: hidden;
        }

        .hero-waves svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 16px;
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        .hero h1 i { margin-right: 12px; }

        .hero p {
            font-size: 1.15rem;
            opacity: 0.92;
            margin-bottom: 36px;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 34px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
            background: #fff;
            color: var(--primary-dark);
            font-family: var(--font);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.7);
            color: #fff;
        }

        .btn-outline:hover {
            background: #fff;
            color: var(--primary);
        }

        /* ===== ABOUT ===== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
        }

        .about-text h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; }
        .about-text p { color: var(--text-light); margin-bottom: 12px; font-size: 1rem; }

        .about-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 28px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px 12px;
            text-align: center;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-sm);
        }

        .stat-card .number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .about-image {
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            background: linear-gradient(135deg, var(--primary-light), var(--surface));
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .about-image i { font-size: 5rem; }
        .about-image span { font-size: 0.85rem; color: var(--text-light); }

        /* ===== HISTORY ===== */
        #historia {
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }

        .history-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .history-text h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .history-text h3:first-child { margin-top: 0; }
        .history-text p { color: var(--text-light); margin-bottom: 12px; }

        .culture-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .culture-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            transition: transform var(--transition);
        }

        .culture-card:hover { transform: translateY(-3px); }
        .culture-card i { font-size: 1.8rem; color: var(--primary); margin-bottom: 8px; }
        .culture-card h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
        .culture-card p { font-size: 0.8rem; color: var(--text-light); }

        /* ===== EVENTS ===== */
        .events-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .event-card-header {
            padding: 20px 20px 12px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .event-date-badge {
            min-width: 52px;
            text-align: center;
            background: var(--primary-light);
            border-radius: var(--radius-xs);
            padding: 8px 4px;
        }

        .event-date-badge .day {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
        }

        .event-date-badge .month {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-light);
        }

        .event-card-body { padding: 0 20px 20px; }
        .event-card-body h4 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
        .event-card-body p { font-size: 0.85rem; color: var(--text-light); margin-bottom: 4px; }
        .event-card-body p i { width: 18px; color: var(--primary); }
        .event-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 10px;
            border-radius: 50px;
            background: var(--primary-light);
            color: var(--primary);
            margin-top: 8px;
        }

        /* ===== PLACES / FEED DO LOCAL ===== */
        .places-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .place-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .place-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .place-image {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: #fff;
            position: relative;
        }

        .place-image .place-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
        }

        .place-info { padding: 16px; }
        .place-info p { font-size: 0.85rem; color: var(--text-light); margin-bottom: 6px; }
        .place-info p i { width: 18px; color: var(--primary); }

        .place-bg-1 { background: linear-gradient(135deg, #1a73e8, #4da3ff); }
        .place-bg-2 { background: linear-gradient(135deg, #e65100, #ff9800); }
        .place-bg-3 { background: linear-gradient(135deg, #2e7d32, #66bb6a); }
        .place-bg-4 { background: linear-gradient(135deg, #6a1b9a, #ab47bc); }
        .place-bg-5 { background: linear-gradient(135deg, #c62828, #ef5350); }
        .place-bg-6 { background: linear-gradient(135deg, #00695c, #26a69a); }

        /* ===== MAP ===== */
        #mapa-section {
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }

        #map {
            height: 450px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            z-index: 1;
        }

        /* ===== GALLERY ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .gallery-item {
            aspect-ratio: 4/3;
            border-radius: var(--radius-sm);
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2.5rem;
            color: var(--text-light);
            transition: transform var(--transition), box-shadow var(--transition);
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: var(--shadow-sm);
        }

        .gallery-item span {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
        }

        /* ===== CURIOSITIES ===== */
        .curiosities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .curio-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 24px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: transform var(--transition);
        }

        .curio-card:hover { transform: translateY(-3px); }
        .curio-card i {
            font-size: 1.5rem;
            color: var(--primary);
            min-width: 40px;
            text-align: center;
            margin-top: 2px;
        }

        .curio-card h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
        .curio-card p { font-size: 0.82rem; color: var(--text-light); }

        /* ===== ROUTE ===== */
        .route-timeline {
            position: relative;
            padding-left: 40px;
        }

        .route-timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--border);
            border-radius: 10px;
        }

        .route-item {
            position: relative;
            margin-bottom: 28px;
        }

        .route-item::before {
            content: '';
            position: absolute;
            left: -29px;
            top: 4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--bg);
        }

        .route-item .time {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .route-item h4 { font-size: 1rem; font-weight: 600; margin: 2px 0 4px; }
        .route-item p { font-size: 0.85rem; color: var(--text-light); }

        /* ===== FOOTER ===== */
        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 48px 0 32px;
            transition: background var(--transition);
        }

        .footer-grid {
            display: grid;
            grid-template
