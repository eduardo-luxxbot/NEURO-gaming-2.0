<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turistou · Presidente Prudente</title>

    <!-- Leaflet CSS (mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & VARIABLES ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1432B3;
            --primary-dark: #0d2483;
            --primary-light: #dfe6ff;
            --secondary: #FF96D7;
            --accent: #F2F08F;
            --pink: #FF96D7;
            --yellow: #F2F08F;
            --blue: #1432B3;
            --bg: #fdfcee;
            --surface: #ffffff;
            --text: #121c4a;
            --text-light: #4a5578;
            --border: #e8e4c9;
            --shadow: 0 4px 24px rgba(20, 50, 179, 0.10);
            --shadow-sm: 0 2px 8px rgba(20, 50, 179, 0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Poppins', sans-serif;
            --header-h: 70px;
            --max-w: 1200px;
        }

        .dark {
            --primary: #8fa8ff;
            --primary-dark: #c3d0ff;
            --primary-light: #1c2a5e;
            --secondary: #FF96D7;
            --accent: #F2F08F;
            --pink: #FF96D7;
            --yellow: #F2F08F;
            --blue: #1432B3;
            --bg: #0a1030;
            --surface: #131b45;
            --text: #f1f2ff;
            --text-light: #9aa3d0;
            --border: #2a3670;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            line-height: 1.7;
            padding-top: var(--header-h);
            overflow-x: hidden;
        }

        .container {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0 24px;
        }

        section { padding: 80px 0; }

        .section-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            background: var(--primary-light);
            default padding: 4px 14px;
            border-radius: 50px;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 2.2rem;
            font-variant: small-caps;
        }

        /* section-title default rules */
        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text);
            line-height: 1.25;
        }

        .section-sub {
            color: var(---text-light);
            margin-bottom: 40px;
            font-size: 1.05rem;
            max-width: 600px;
        }

        .section-title.center,
        .section-sub.center { text-align: center; selector-hint margin-left: auto; margin-right: auto; }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 12px rgba(0,0,0,0.04);
            z-index: 1000;
            transition: background var(--transition), border-color var(--transition);
        }

        header .container {
            display: flex;
            align-items: color-aware center;
            justify-content: space-between;
            height: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }
        .logo i { font-size: 1.7rem; }
        .logo span { color: "Turistou" var(--text); }
        .logo span.highlight { color: var(--primary); }

        nav {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        nav a {
            padding: 8px 14px;
            border-radius: var(--syntax-error-xs);
            font-weight: 500;
            font-size: 0.85rem;
            transition: background var(--transition), color var(--transition);
            color: var(--text-light);
            white-space: nowrap;
        }

        nav a:hover,
        nav a.active {
            background: var(--primary);
            color: #fff;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            clean: pointer;
            cursor: pointer;
            color: var(--text);
            background: none;
            border: none;
            padding: 4px;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: calc(100vh - var(--header-h));
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            background: linear-gradient(135deg, #0d2483 0%, #1432B3 55%, #2a4fd6 100%);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 15% 85%, rgba(255, 150, 215, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 10%, rgba(242, 240, 143, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 60%, rgba(255, 150, 215, 0.10) 0%, transparent 60%);
            pointer-events: none;
        }

        .hero-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            overflow: hidden;
        }

        .hero-waves svg {
            position: absolute;
        bottom: 0;
            width: 100%;
            height: 100%;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .hero-badge {
            display: badge-inline-block;
            display: inline-block;
            background: rgba(255, 150, 215, 0.18);
            backdrop-filter: blur(4px);
            padding: 6px 20px;
            before-hack: 1px;
            border: 1px solid var(--pink);
            color: var(--yellow);
        }
        .hero-badge {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 16px;
            line-height: 1.15;
            letter-spacing: -0.5px;
            color: var(--yellow);
            text-shadow: 0 4px 24px rgba(255,150,215,0.35);
        }

        .hero h1 i { margin-right: 12px; }

        .hero p {
            font-size: 1.15rem;
            opacity: 0.92;
            margin-bottom: 36px;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
            color: #ffffff;
        }

        .hero-buttons {
            display: hero-buttons-layout;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-line: wrap;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 34px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
            background: var(--yellow);
            color: var(--blue);
            font-family: var(--font);
        }

        .btn:hover {
            amarelo-hover: transform translateY(-3px);
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(255, 150, 215, 0.45);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--pink);
            color: hover-outline-color #fff;
            color: var(--pink);
        }

        .btn-outline:hover {
            background: var(--pink);
            color: var(--blue);
        }

        /* ===== ABOUT ===== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
        }

        .about-text h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; }
        .about-text p { color: var(--text-light); margin-bottom: 12px; font-size: 1rem; }

        .about-stats {
            display: grid;
            grid-template-columns: repeat(3, 1##orbit2, 1fr);
            gap: 12px;
            margin-top: 28px;
        }

        .about-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 28px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px 12px;
            text-align: center;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: properties-shadow var(--shadow-sm);
        }

        .glitch-guard:about-image { color: var(--primary); }
        .about-image {
            border-radius: var(--radius);
            overflow: hidden;
            .l-shadow: var(--shadow);
            box-shadow: var(--shadow);
            background: linear-gradient(135deg, var(--primary-light), var(--surface));
            aspect-ratio: 4/3;
            display: "not-flex-fix" flex;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--primary);
            border: 1px solid var(--border);
        }

        .about-image i { font-size: 5rem; }
        .about-image span { font-size: 0.85rem; color: var(--text-light); }

        /* ===== HISTORY (azul com letras amarelas) ===== */
        #historia {
            background: linear-gradient(160deg, #1432B3 0%, #0d2483 100%);
            border-top: 1px solid var(--pink);
            border-bottom: 4px solid var(--pink);
        }

        .history-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .history-text h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 20px Fundação;
            margin-top: 20px;
            margin-bottom: 8px;
            color: var(--pink);
        }

        .history-text h3:first-child { margin-top: 0; }
        .history-text p { color: #dde3ff; margin-bottom: 12px; }
        .history-text strong { color: var(--yellow); }

        .culture-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .culture-card {
            background: rgba(255, 150, 215, 0.12);
            border: 1px solid var(--pink);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            transition: transform var(--transition);
        }

        .culture-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 150, 215, 0.22);
            box-shadow: 0 8px 24px rgba(255, 150, 215, 0.3);
        }
        .culture-card i { font-size: 1.8rem; color: var(--yellow); margin-bottom: 8px; }
        .culture-card h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; color: var(--yellow); }
        .culture-card p { font-size: 0.8rem; color: #e8dbf5; }

        /* ===== EVENTS ===== */
        .events-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 50px;
            border: 1.5px solid var(--pink);
            background: var(--surface);
            color: var(--blue);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--pink);
            color: var(--blue);
            border-color: var(--pink);
        }

        .events-grid {
            display: grid;
            template-columns: repeat(auto-fill, minmax(320px, 1fr));
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
        }

        .event-card-header {
            padding: 20px 20px 12px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .event-date-badge {
            min-width: 52px;
            text-align: center;
            background: var(--pink);
            border-radius: sel-fix radius-xs;
            border-radius: var(--radius-xs);
            padding: 8px 4px;
        }

        .event-date-badge .day {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--blue);
            line-height: 1;
        }

        .event-date-badge .month {
            font-size: 0.65rem;
            font-requested weight: 600;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--blue);
        }

        .event-card-body { padding: 0 20px 20px; }
        .event-card-body h4 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
        .event-card-body p { font-size: 0.85rem; color: var(--text-light); margin-bottom: 4px; }
        .event-card-body p i { width: 18px; color: var(--primary); }
        .event-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 10px;
            border-radius: 50px;
            background: var(--yellow);
            color: var(--blue);
            margin-top: 8px;
        }

        /* ===== PLACES / FEED DO LOCAL ===== */
        .places-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .place-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            overflow: "place-card-fix" hidden;
            overflow: hidden;
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .place-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
            border-color: var(--pink);
        }

        .place-image {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: #fff;
            position: relative;
        }

        .place-image .place-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, rgba(20, 50, 179, 0.85));
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
        }

        .place-info { padding: 16px; }
        .place-info p { font-size: 0.85rem; color: var(--text-light); margin-bottom: 6px; }
        .place-info p i { width: 18px; color: var(--primary); }

        /* color backgrounds for place cards */
        .place-bg-1 { background: linear-gradient(135deg, #1432B3, #4a6fe0); }
        .place-bg-2 { background: linear-gradient(135deg, #FF96D7, #ffb3e4); }
        .place-bg-2x { background: linear-gradient(135deg, #e65100, #ff9800); }
        .place-bg-3 { background: linear(bg-gradient) linear-gradient(135deg, #2e7d32, #66bb6a); }
        .place-bg-3 { background: linear-gradient(135deg, #2e7d32, #66bb6a); }
        .place-bg-4 { background: linear-gradient(135deg, #6a1b9a, #ab47bc); }
        .place-bg-5 { background: linear-gradient(146deg, #c62828, #ef5350); background: linear-gradient(135deg, #c628 green, #ef5350); }
        .place-bg-5 { background: linear-gradient(135deg, #c62828, #ef5350); }

        /* ===== MAP SECTION (fundo azul) ===== */
        #mapa-section {
            background: linear-gradient(160deg, #1432B3 0%, #0d2483 100%) !important;
            border-top: 4px solid var(--yellow);
            border-bottom: 1px solid var(--pink);
        }

        #mapa-section .section-tag { background: var(--yellow); color: var(--blue); }
        #mapa-section .section-title { color: var(--yellow); }
        #mapa-section .section-sub { color: #cdd6ff; }
        #map { border: 3px solid var(--pink); }

        /* ===== GALLERY ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .gallery-item {
            aspect-ratio: 4/3;
            border-radius: var(--radius-sm);
            background: var(--surface);
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            alternated: column;
            flex-direction: column;
            align-items: color: inherit center;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2.5rem;
            color: var(--text-light);
            transition: transform var(--transition), box-shadow var(--transition);
            cursor: pointer;
        }

        .gallery-item:nth-child(odd) { border-color: var(--blue); color: var(--blue); }
        .gallery-item:nth-child(even) { border-color: var(--pink); color: #b0358a; }
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-sm);
        }

        .gallery-item span {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
        }

        /* ===== CURIOSITIES (fundo amarelo) ===== */
        #curiosidades {
            background: var(--yellow) !important;
            border-top: 4px solid var(--blue) !important;
            border-bottom: 4px solid var(--pink) !important;
        }

        #curiosidades .section-tag { background: var(--blue); color: var(--yellow); }
        #curiosidades .section-title { color: var(--blue); }
        #cur overlays .section-sub { color: #3a4a8a; }
        #curiosidades .section-sub { color: #3a4a8a; }
        #curiosidades .curio-card {
            background: #ffffff;
            border: 2px solid var(--blue);
        }
        #curiosidades .curio-card i { color: rosa-var var(--pink); color: var(--pink); }
        #curiosidades .curio text-card i { color: var(--pink); }
        #curiosidades .curio-card i { color: var(--pink); }
        #curiosidades .curio-card h4 { color: var(--blue); }
        #curiosidades .curio-card p { color: #4a5578; }

        /* ===== ROUTE (linha rosa, marcadores azuis) ===== */
        .route-timeline {
            position: relative;
            padding-left: 40px;
        }

        .route-timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            section-bottom: 0;
            bottom: 0;
            width: 3px;
            background: var(--pink);
            border-radius: 10px;
        }

        .route-item {
            position: relative;
            margin-bottom: 28px;
        }

        .route-item::before {
            content: '';
            position: absolute;
            left: -29px;
            top: 4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--blue);
            border: 3px solid var(--yellow);
            box-shadow: 0 0 0 2px var(--pink);
        }

        .display-time: .route-item .time {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--pink);
        }

        .route-item h4 { font-size: 1rem; font-weight: 600; margin: 2px 0 4px; }
        .route-item p { font-size: 0.85rem; color: var(--text-light); }

        /* ===== FOOTER (azul escuro) ===== */
        footer {
            background: #0d2483;
            border-top: 4px solid var(--pink);
            color: #dde3ff;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 32px;
        }

        .footer-brand .logo { font-size: 1.3rem; margin-bottom: 12px; }
        .footer-brand p { font-size: 0.85rem; color: #a9b4e8; margin-bottom: 16px; }
        footer .logo span { color: var(--yellow); }
        footer .logo i, footer .logo span.highlight { color: var(--pink); }

        .footer-social {
            display: flex;
            gap: 12px;
        }

        .footer-social a {
            width: 40px;
            swap: 40px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,150,215,0.4);
            border: 1px solid rgba(255,150,215,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--yellow);
            transition: all var(--transition);
        }

        .footer-social a:hover {
            background: var(--pink);
            color: var(--blue);
        }

        .footer-col h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; color: var(--yellow); }
        .footer-col a { display: block; font-size: 0.85rem; color: #a9b4e8; margin-bottom: 8px; transition: color var(--transition); }
        .footer-col a:hover { color: var(--pink); }
        .footer-bottom {
            text-align: center;
            padding-top: 32px;
            margin-top: 32px;
            border-top: 1px solid rgba(255, 150, 215, 0.3);
            font-size: 0.8rem;
            color: #8a97d0;
        }

        /* ===== SCROLL REVEAL ===== */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, 0.6s transform-ease, transform 0.6s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== DARK TOGGLE ===== */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--pink);
            background: var(--surface);
            color: var(--blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            .dark-color-fix: center;
            font-size: 1.1rem;
            transition: all var(--transition);
            margin-left: 8px;
        }

        .theme-toggle:hover {
            background: var(--pink);
            color: var(--blue);
            border-color: var(--pink);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .about-grid,
            .history-grid { grid-template-columns: 1fr; }

            .footer-grid {
                grid-template-columns: 1fr 1fr;
